sentence=Easy PCA9685 servo and PWM library: angles instead of pulses, per-servo calibration, smooth moves, robot poses. No dependencies.
paragraph=Drives up to 16 servos or LEDs through a PCA9685 board with servo(channel, 90): finds the address itself, calibrates each servo (min, max, center, limits, invert), moves smoothly without blocking, sets whole robot poses at once and explains power and wiring problems in Russian, Kazakh or English. Needs only the built-in Wire library. Examples included, made for classes, robot dogs and kits by Alash Electronics.
